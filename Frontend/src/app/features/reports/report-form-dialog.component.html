<h2 mat-dialog-title>File a report</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="flex flex-col gap-2 pt-1">
    <div class="flex flex-col gap-2 sm:flex-row sm:gap-3">
      <mat-form-field appearance="outline" class="w-full sm:flex-1">
        <mat-label>Subject type</mat-label>
        <mat-select formControlName="subjectType">
          @for (t of subjectTypes; track t) {
            <mat-option [value]="t">{{ t === 'MANAGER' ? 'Travel manager' : 'Traveler' }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full sm:w-40">
        <mat-label>Subject ID</mat-label>
        <input matInput type="number" min="1" formControlName="subjectId" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Related travel ID (optional)</mat-label>
      <input matInput type="number" min="1" formControlName="travelId" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Reason</mat-label>
      <textarea matInput formControlName="reason" rows="4" maxlength="2000"></textarea>
    </mat-form-field>

    @if (errorMessage()) {
      <p class="text-sm text-red-600">{{ errorMessage() }}</p>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="saving()">Cancel</button>
  <button mat-flat-button color="primary" (click)="submit()" [disabled]="saving()">
    {{ saving() ? 'Filing…' : 'File report' }}
  </button>
</mat-dialog-actions>
